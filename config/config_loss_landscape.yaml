functions:
  - name: linear
    func:
      _target_: spbunn.optimization.objectives.LinearFunc
      _partial_: True
    theta_0_true: 1
    theta_1_true: 2
    theta_0_range: [-5, 5]
    theta_1_range: [0, 3]
    theta_0_initial_guess: -2
    theta_1_initial_guess: 0
    levels: [0.01, 0.03, 0.1, 0.3, 1, 3, 10, 30, 100]
    lr: 1e-2
    n_steps: 200
    adam_lr: 1e-1
    x_min: 6
    x_max: 10
