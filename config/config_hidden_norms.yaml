defaults:
  - _self_
  - user_settings: user_settings
  - hydra: base

result_dir: ${user_settings.result_dir}
hydra_root: ${user_settings.hydra_root}
hydra_dir: ${user_settings.hydra_dir}

input_dim: 16
hidden_dim: 256
batch_size: 256
n_seeds: 5
activation: relu
experiments: [init, conditioning]
depth_grid: [1, 2, 4, 8, 16, 32, 64]
weight_scale: 0.08838834764831845
init_sweep:
  n_layers: 32
  weight_scales:
    1.0/sqrt(N): 0.0625
    sqrt(2/N): 0.08838834764831845
    1.0 (unscaled): 1.0
conditioning:
  n_inputs: 16
  n_perturbations: 8
  perturbation_norm: 1.0e-3
  plain_variants:
    - label: 1.0/sqrt(N)
      residual: false
      branch_scale: 1.0
      weight_scale: 0.0625
    - label: 1.0 (unscaled)
      residual: false
      branch_scale: 1.0
      weight_scale: 1.0
    - label: Kaiming sqrt(2/N)
      residual: false
      branch_scale: 1.0
      weight_scale: ${weight_scale}
  residual_variants:
    - label: plain
      residual: false
      branch_scale: 1.0
      weight_scale: null
    - label: residual (branch x1)
      residual: true
      branch_scale: 1.0
      weight_scale: null
    - label: residual (branch x1/sqrt(L))
      residual: true
      branch_scale: -1.0
      weight_scale: null
    - label: residual (branch x1/L)
      residual: true
      branch_scale: -2.0
      weight_scale: null
report:
  title: Hidden-norm and Jacobian propagation diagnostics
  artifact_name: hidden_norms_propagation.html
