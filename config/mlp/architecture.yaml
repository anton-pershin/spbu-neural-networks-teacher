# @package _global_
# Shared numerical settings for the MLP width and depth experiments.
function_names: [cubic, gaussian, discontinuous, periodic]
n_samples: 100
x_lims: [-2.0, 2.0]
lr_grid: [1.0e-5, 3.0e-5, 1.0e-4, 3.0e-4, 1.0e-3, 3.0e-3, 1.0e-2, 3.0e-2, 1.0e-1, 3.0e-1]
lr_gamma: 0.1
step_size_fractions: [0.1, 0.25, 0.5]
lr_search_epochs: 3000
lr_eval_tail_fraction: 0.1
lr_search_seeds: [42, 43, 44]
output_schedule_by_epoch: [1, 10, 50, 100, 1000, 10000]
loss_ema_beta: 0.9
smoothed_loss_min_epoch: 1000
final_n_epochs: 30000
