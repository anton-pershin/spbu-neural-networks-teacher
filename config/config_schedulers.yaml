defaults:
  - _self_
  - user_settings: user_settings
  - hydra: base

result_dir: ${user_settings.result_dir}
hydra_root: ${user_settings.hydra_root}
hydra_dir: ${user_settings.hydra_dir}

starting_lr: 0.1
n_epochs: 40
report:
  title: Learning-rate schedules
  artifact_name: schedulers.html
schedulers:
  - name: linearlr
    title: Linear schedule
    schedule_type: linear
    decrement: 0.003
    annotations:
      - text: Last epoch
        xy: [19, 0.045]
        xytext: [25, 0.052]
  - name: steplr
    title: Step schedule
    schedule_type: step
    alpha: 0.5
    step_size: 5
    last_epoch: 25
    annotations:
      - text: Last epoch
        xy: [20, 0.02]
        xytext: [25, 0.04]
  - name: reducelronplateau
    title: Reduce on plateau
    schedule_type: reduce_on_plateau
    alpha: 0.5
    annotations:
      - text: Loss stagnation
        xy: [10, 0.052]
        xytext: [14, 0.062]
      - text: Loss st.
        xy: [30, 0.027]
        xytext: [32, 0.045]
  - name: cosineannealing
    title: Cosine annealing
    schedule_type: cosine_annealing
    repetitions: 4
    annotations:
