[project]
name = "spbu-neural-networks-teacher"
description = "Executable neural-network teaching materials for SpbU"
dynamic = ["version"]
authors = [
  {name = "Anton Pershin", email = "tony.pershin@gmail.com"},
]
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
dependencies = [
  "hydra-core>=1.3.0",
  "matplotlib",
  "numpy>=2.0.0",
  "pandas>=2.2.2",
  "scipy>=1.14.0",
  "tensorboard",
  "torch>=2.2.2",
  "torchaudio",
  "torchvision",
]

[build-system]
requires = ["hatchling>=1.26", "versioningit"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "versioningit"

[tool.hatch.build.targets.wheel]
packages = ["spbunn"]

[tool.versioningit]
default-version = "0.0.0"

[tool.isort]
profile = "black"
line_length = 88
known_third_party = "hydra,matplotlib"

[tool.pylint]
max-line-length = 88
min-similarity-lines = 12

[tool.pylint.'MESSAGES CONTROL']
disable = [
  "missing-docstring",
  "too-few-public-methods",
  "too-many-arguments",
  "too-many-positional-arguments",
  "wrong-import-order",
  "too-many-instance-attributes",
  "too-many-locals",
  "no-else-return",
  "too-many-return-statements",
]

[tool.mypy]
disable_error_code = ["import-untyped"]
